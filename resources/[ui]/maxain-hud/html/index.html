<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxain Speedometer HUD</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud-container" class="hud-container hidden">
        <!-- Location & Street Info Banner -->
        <div class="street-banner">
            <i class="fa-solid fa-location-dot"></i>
            <span id="street-name">LOS SANTOS</span>
        </div>

        <!-- Speedometer Dial & Digital Gauge -->
        <div class="speedo-wrapper">
            <!-- Circular Progress Ring SVG -->
            <svg class="speedo-gauge" viewBox="0 0 200 200">
                <circle class="gauge-bg" cx="100" cy="100" r="85"></circle>
                <circle id="gauge-fill" class="gauge-fill" cx="100" cy="100" r="85"></circle>
            </svg>

            <!-- Digital Content Inside Gauge -->
            <div class="speedo-content">
                <!-- Drift Mode Badge -->
                <div id="drift-badge" class="drift-badge hidden">
                    <i class="fa-solid fa-wind"></i> DRIFT
                </div>

                <!-- Speed Reading -->
                <div class="speed-box">
                    <span id="speed-value">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>

                <!-- Gear & Extra Info -->
                <div class="meta-row">
                    <div class="gear-box">
                        <span class="meta-label">GEAR</span>
                        <span id="gear-value">N</span>
                    </div>
                    <div class="fuel-box">
                        <span class="meta-label">FUEL</span>
                        <span id="fuel-value">100%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
