<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBCore Vehicle Spawner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="spawner-modal" class="hidden">
        <div class="spawner-card">
            <div class="spawner-header">
                <h2>VEHICLE SPAWNER</h2>
                <span class="badge">QBCORE</span>
            </div>

            <div class="category-tabs" id="category-tabs">
                <!-- Dynamic categories -->
            </div>

            <div class="vehicle-grid" id="vehicle-grid">
                <!-- Dynamic vehicles -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
